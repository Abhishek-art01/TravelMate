services:
  redis:
    image: redis:7-alpine
    container_name: travelmate-redis
    restart: unless-stopped
    ports:
    - 6379:6379
    volumes:
    - ./redis-data:/data
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: travelmate-api
    restart: unless-stopped
    dns:
    - 8.8.8.8
    - 1.1.1.1
    working_dir: /app
    volumes:
    - ./services/api:/app
    ports:
    - 8000:8000
    depends_on:
    - redis
    environment:
      REDIS_URL: redis://redis:6379/0
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
      ADMIN_API_BASE_URL: ${ADMIN_API_BASE_URL}
      ANDROID_PACKAGE: ${ANDROID_PACKAGE}
      API_BASE_URL: ${API_BASE_URL}
      APP_ENV: ${APP_ENV}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS}
      DOTENV_PUBLIC_KEY: ${DOTENV_PUBLIC_KEY}
      FASTAPI_DEBUG: ${FASTAPI_DEBUG}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      GRIEVANCE_CONTACT_EMAIL: ${GRIEVANCE_CONTACT_EMAIL}
      IOS_BUNDLE_ID: ${IOS_BUNDLE_ID}
      MEDIA_MAX_PROFILE_PHOTOS: ${MEDIA_MAX_PROFILE_PHOTOS}
      MEDIA_MAX_PROFILE_PHOTO_SIZE_BYTES: ${MEDIA_MAX_PROFILE_PHOTO_SIZE_BYTES}
      MEDIA_SIGNED_URL_TTL_SECONDS: ${MEDIA_SIGNED_URL_TTL_SECONDS}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_USERNAME: ${MONGODB_USERNAME}
      NODE_ENV: ${NODE_ENV}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
      PAYMENT_SECRET: ${PAYMENT_SECRET}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE}
      POSTGRES_USER: ${POSTGRES_USER}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_REGION: ${R2_REGION}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      VERIFICATION_PROVIDER: ${VERIFICATION_PROVIDER}
      VERIFICATION_PROVIDER_REGION: ${VERIFICATION_PROVIDER_REGION}
      VERIFICATION_R2_BUCKET: ${VERIFICATION_R2_BUCKET}
      VERIFICATION_WEBHOOK_SECRET: ${VERIFICATION_WEBHOOK_SECRET}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_AUTH_PROVIDERS: ${VITE_AUTH_PROVIDERS}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.node
    container_name: travelmate-web
    restart: unless-stopped
    dns:
    - 8.8.8.8
    - 1.1.1.1
    working_dir: /workspace
    volumes:
    - .:/workspace
    command: pnpm --filter web dev --host 0.0.0.0
    ports:
    - 5173:5173
    depends_on:
    - api
    environment:
    - ADMIN_API_BASE_URL=${ADMIN_API_BASE_URL}
    - ANDROID_PACKAGE=${ANDROID_PACKAGE}
    - API_BASE_URL=${API_BASE_URL}
    - APP_ENV=${APP_ENV}
    - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
    - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
    - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    - DATABASE_URL=${DATABASE_URL}
    - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS}
    - DOTENV_PUBLIC_KEY=${DOTENV_PUBLIC_KEY}
    - FASTAPI_DEBUG=${FASTAPI_DEBUG}
    - FASTAPI_HOST=${FASTAPI_HOST}
    - FASTAPI_PORT=${FASTAPI_PORT}
    - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
    - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
    - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
    - GRIEVANCE_CONTACT_EMAIL=${GRIEVANCE_CONTACT_EMAIL}
    - IOS_BUNDLE_ID=${IOS_BUNDLE_ID}
    - MEDIA_MAX_PROFILE_PHOTOS=${MEDIA_MAX_PROFILE_PHOTOS}
    - MEDIA_MAX_PROFILE_PHOTO_SIZE_BYTES=${MEDIA_MAX_PROFILE_PHOTO_SIZE_BYTES}
    - MEDIA_SIGNED_URL_TTL_SECONDS=${MEDIA_SIGNED_URL_TTL_SECONDS}
    - MONGODB_PASSWORD=${MONGODB_PASSWORD}
    - MONGODB_URI=${MONGODB_URI}
    - MONGODB_USERNAME=${MONGODB_USERNAME}
    - NODE_ENV=${NODE_ENV}
    - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
    - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME}
    - PAYMENT_API_KEY=${PAYMENT_API_KEY}
    - PAYMENT_PROVIDER=${PAYMENT_PROVIDER}
    - PAYMENT_SECRET=${PAYMENT_SECRET}
    - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET}
    - POSTGRES_DB=${POSTGRES_DB}
    - POSTGRES_HOST=${POSTGRES_HOST}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_PORT=${POSTGRES_PORT}
    - POSTGRES_SSLMODE=${POSTGRES_SSLMODE}
    - POSTGRES_USER=${POSTGRES_USER}
    - PRIVACY_CONTACT_EMAIL=${PRIVACY_CONTACT_EMAIL}
    - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
    - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
    - R2_BUCKET=${R2_BUCKET}
    - R2_ENDPOINT=${R2_ENDPOINT}
    - R2_REGION=${R2_REGION}
    - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
    - REDIS_URL=${REDIS_URL}
    - SENTRY_DSN=${SENTRY_DSN}
    - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
    - SUPABASE_JWT_AUDIENCE=${SUPABASE_JWT_AUDIENCE}
    - SUPABASE_JWT_ISSUER=${SUPABASE_JWT_ISSUER}
    - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    - SUPABASE_URL=${SUPABASE_URL}
    - VERIFICATION_PROVIDER=${VERIFICATION_PROVIDER}
    - VERIFICATION_PROVIDER_REGION=${VERIFICATION_PROVIDER_REGION}
    - VERIFICATION_R2_BUCKET=${VERIFICATION_R2_BUCKET}
    - VERIFICATION_WEBHOOK_SECRET=${VERIFICATION_WEBHOOK_SECRET}
    - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    - VITE_AUTH_PROVIDERS=${VITE_AUTH_PROVIDERS}
    - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
  admin-web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.node
    container_name: travelmate-admin-web
    restart: unless-stopped
    dns:
    - 8.8.8.8
    - 1.1.1.1
    working_dir: /workspace
    volumes:
    - .:/workspace
    command: pnpm --filter admin-web dev --host 0.0.0.0
    ports:
    - 4173:4173
    depends_on:
    - api
    environment:
    - ADMIN_API_BASE_URL=${ADMIN_API_BASE_URL}
    - ANDROID_PACKAGE=${ANDROID_PACKAGE}
    - API_BASE_URL=${API_BASE_URL}
    - APP_ENV=${APP_ENV}
    - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
    - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
    - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    - DATABASE_URL=${DATABASE_URL}
    - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS}
    - DOTENV_PUBLIC_KEY=${DOTENV_PUBLIC_KEY}
    - FASTAPI_DEBUG=${FASTAPI_DEBUG}
    - FASTAPI_HOST=${FASTAPI_HOST}
    - FASTAPI_PORT=${FASTAPI_PORT}
    - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
    - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
    - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
    - GRIEVANCE_CONTACT_EMAIL=${GRIEVANCE_CONTACT_EMAIL}
    - IOS_BUNDLE_ID=${IOS_BUNDLE_ID}
    - MEDIA_MAX_PROFILE_PHOTOS=${MEDIA_MAX_PROFILE_PHOTOS}
    - MEDIA_MAX_PROFILE_PHOTO_SIZE_BYTES=${MEDIA_MAX_PROFILE_PHOTO_SIZE_BYTES}
    - MEDIA_SIGNED_URL_TTL_SECONDS=${MEDIA_SIGNED_URL_TTL_SECONDS}
    - MONGODB_PASSWORD=${MONGODB_PASSWORD}
    - MONGODB_URI=${MONGODB_URI}
    - MONGODB_USERNAME=${MONGODB_USERNAME}
    - NODE_ENV=${NODE_ENV}
    - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
    - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME}
    - PAYMENT_API_KEY=${PAYMENT_API_KEY}
    - PAYMENT_PROVIDER=${PAYMENT_PROVIDER}
    - PAYMENT_SECRET=${PAYMENT_SECRET}
    - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET}
    - POSTGRES_DB=${POSTGRES_DB}
    - POSTGRES_HOST=${POSTGRES_HOST}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_PORT=${POSTGRES_PORT}
    - POSTGRES_SSLMODE=${POSTGRES_SSLMODE}
