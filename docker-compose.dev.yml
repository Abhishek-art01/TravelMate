services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: travelmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: travelmate
      POSTGRES_USER: travelmate
      POSTGRES_PASSWORD: travelmate
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: travelmate-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: travelmate
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: travelmate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: travelmate-api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./services/api:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mongo
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: travelmate
      POSTGRES_USER: travelmate
      POSTGRES_PASSWORD: travelmate
      DATABASE_URL: postgresql+asyncpg://travelmate:travelmate@postgres:5432/travelmate
      MONGODB_URI: mongodb://admin:admin@mongo:27017/travelmate
      REDIS_URL: redis://redis:6379/0
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.node
    container_name: travelmate-web
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - .:/workspace
    env_file:
      - .env
    command: pnpm --filter web dev --host 0.0.0.0
    ports:
      - "5173:5173"
    depends_on:
      - api

  admin-web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.node
    container_name: travelmate-admin-web
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - .:/workspace
    env_file:
      - .env
    command: pnpm --filter admin-web dev --host 0.0.0.0
    ports:
      - "4173:4173"
    depends_on:
      - api
