services:
  redis:
    image: redis:7-alpine
    container_name: travelmate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: travelmate-api
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    working_dir: /app
    volumes:
      - ./services/api:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.node
    container_name: travelmate-web
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    working_dir: /workspace
    volumes:
      - .:/workspace
    env_file:
      - .env
    command: pnpm --filter web dev --host 0.0.0.0
    ports:
      - "5173:5173"
    depends_on:
      - api

  admin-web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.node
    container_name: travelmate-admin-web
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    working_dir: /workspace
    volumes:
      - .:/workspace
    env_file:
      - .env
    command: pnpm --filter admin-web dev --host 0.0.0.0
    ports:
      - "4173:4173"
    depends_on:
      - api
