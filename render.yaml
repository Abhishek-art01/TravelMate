services:
  - type: web
    name: travelmate-api
    env: docker
    region: singapore # Adjust this based on your Supabase location
    plan: free
    dockerContext: ./services/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: FASTAPI_HOST
        value: 0.0.0.0
      - key: FASTAPI_PORT
        value: 8000
      - key: REDIS_URL
        fromService:
          type: redis
          name: travelmate-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false # Requires manual entry in the Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  - type: redis
    name: travelmate-redis
    region: singapore
    plan: free
    ipAllowList: []
