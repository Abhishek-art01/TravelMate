name: TravelMate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web apps
        run: pnpm run --parallel lint || echo "No lint script found"

      - name: Test web apps
        run: pnpm run --parallel test || echo "No test script found"

      - name: Build web apps
        run: pnpm run build

  backend:
    name: Backend Test
    runs-on: ubuntu-latest
    services:
      # Start a local Redis server for the backend tests
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      APP_ENVIRONMENT: testing
      REDIS_URL: redis://localhost:6379/0
      # Test tests don't require actual Supabase if they are mocked, but just in case:
      DATABASE_URL: sqlite+aiosqlite:///:memory:
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        working-directory: ./services/api
        run: python -m pytest tests/ -v -q --ignore=tests/test_seed_presentation.py
