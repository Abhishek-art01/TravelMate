[project]
name = "travelmate-api"
version = "0.1.0"
description = "TravelMate FastAPI backend foundation"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "sqlalchemy==2.0.35",
  "asyncpg==0.31.0",
  "alembic==1.14.0",
  "motor==3.6.0",
  "dnspython==2.8.0",
  "redis==5.1.1",
  "supabase==2.8.1",
  "python-dotenv==1.0.1",
  "httpx==0.27.2",
  "PyJWT==2.15.1",
  "cryptography==45.0.7",
  "aiosqlite==0.22.1",
  "boto3==1.43.106",
  "Pillow==12.3.0",
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "ruff==0.7.4",
  "mypy==1.13.0",
]

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
